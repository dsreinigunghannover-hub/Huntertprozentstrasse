<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Whalla ich hab Talent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0F; --card:#141319; --text:#F5F3EE; --muted:rgba(245,243,238,0.5);
    --muted2:rgba(245,243,238,0.3); --border:rgba(255,255,255,0.08); --accent:#FF2D78;
    --danger:#FF7A7A; --danger-bg:rgba(255,85,85,0.13); --ok:#2DD4BF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;min-height:100vh;}
  h1,h2,.display{font-family:'Anton',sans-serif;letter-spacing:0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px;}
  header{position:sticky;top:0;z-index:40;background:rgba(11,11,15,0.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  .header-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 0;}
  .logo{display:flex;align-items:center;gap:8px;}
  .logo-badge{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--accent);background:radial-gradient(circle at 30% 30%, var(--accent), transparent 70%);font-size:16px;}
  .logo-text{font-size:1.05rem;}
  .navbtns{display:flex;gap:6px;background:var(--card);border-radius:999px;padding:4px;}
  .navbtn{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;padding:7px 12px;border-radius:999px;background:transparent;color:var(--muted);}
  .navbtn.active{background:var(--accent);color:#0B0B0F;}
  main{padding:32px 0 60px;}
  .hero{text-align:center;margin-bottom:32px;}
  .hero h1{font-size:clamp(2rem,8vw,3.2rem);line-height:0.95;margin:0 0 10px;}
  .hero p{color:var(--muted);margin:0;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;}
  .section-label{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;}
  input[type=text],input[type=password],input[type=url],textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:12px 14px;font-family:inherit;font-size:14px;outline:none;
  }
  input::placeholder,textarea::placeholder{color:var(--muted2);}
  input.err,textarea.err{border-color:var(--danger);}
  textarea{resize:none;}
  .field{margin-bottom:10px;}
  .errtext{color:var(--danger);font-size:11px;margin-top:4px;}
  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:800;border-radius:10px;padding:12px 16px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;}
  .btn-accent{background:var(--accent);color:#0B0B0F;}
  .btn-accent:disabled{opacity:0.6;cursor:default;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-outline{background:transparent;border:1px solid var(--accent);color:var(--accent);width:auto;padding:8px 12px;font-size:12px;}
  .togglegroup{display:inline-flex;gap:4px;background:var(--bg);border-radius:999px;padding:4px;margin-bottom:14px;}
  .togglebtn{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;padding:7px 12px;border-radius:999px;background:transparent;color:var(--muted);}
  .togglebtn.active{background:var(--accent);color:#0B0B0F;}
  .filedrop{width:100%;border-radius:10px;padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;border:1.5px dashed var(--border);background:var(--bg);}
  .filedrop.hasfile{border-color:var(--accent);}
  .filedrop.err{border-color:var(--danger);}
  .fileicon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,45,120,0.13);color:var(--accent);flex-shrink:0;font-size:16px;}
  .ticket{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:8px;}
  .ticket-num{width:34px;height:34px;border-radius:8px;background:var(--bg);border:1px solid rgba(255,45,120,0.27);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-size:13px;}
  .ticket-body{min-width:0;flex:1;}
  .ticket-name{font-weight:700;display:inline;}
  .boostbadge{font-size:9px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(255,45,120,0.13);color:var(--accent);margin-left:6px;}
  .ticket-sub{color:var(--muted2);font-size:12px;display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ticket-msg{color:var(--muted);font-size:12px;margin-top:3px;}
  .ticket-actions{display:flex;gap:6px;flex-shrink:0;}
  .iconbtn{width:32px;height:32px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .empty{color:var(--muted2);font-size:14px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .modal{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;position:relative;}
  .boostgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;}
  .boostopt{border-radius:12px;padding:12px 0;text-align:center;cursor:pointer;background:transparent;border:2px solid var(--border);}
  .boostopt.sel{border-color:var(--accent);background:rgba(255,45,120,0.13);}
  .roomlink{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;word-break:break-all;}
  .accentgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .swatch{width:38px;height:38px;border-radius:50%;margin:0 auto 6px;cursor:pointer;}
  .swatchlabel{font-size:10px;color:var(--muted);text-align:center;}
  .banner{font-size:12px;padding:10px 12px;border-radius:10px;margin-bottom:14px;}
  .banner-warn{background:rgba(255,197,61,0.13);color:#FFC53D;}
  .banner-err{background:var(--danger-bg);color:var(--danger);}
  .banner-ok{color:var(--accent);text-align:center;font-size:13px;margin-top:10px;}
  audio,video{width:100%;margin-top:8px;border-radius:8px;}
  video{max-height:180px;background:#000;}
  img.filepreview{max-height:180px;border-radius:8px;margin-top:8px;display:block;}
  .spotbeam{pointer-events:none;position:absolute;top:0;left:0;right:0;height:280px;background:radial-gradient(ellipse 60% 40% at 50% -10%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 70%);}
  .stack{display:flex;flex-direction:column;gap:20px;}
  .center{text-align:center;}
  .linkbtn{background:transparent;border:none;color:var(--muted);font-family:inherit;font-size:12px;cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>
<div id="app" style="position:relative;"></div>

<script>
/* ---------- utils ---------- */
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtBytes = (b) => b < 1024 ? b+" B" : b < 1024*1024 ? (b/1024).toFixed(0)+" KB" : (b/1024/1024).toFixed(1)+" MB";
const MAX_FILE_BYTES = 2 * 1024 * 1024;
const ACCENTS = [
  {id:"magenta",label:"Bühnenlicht",hex:"#FF2D78"},
  {id:"gold",label:"Gold-Glanz",hex:"#FFC53D"},
  {id:"teal",label:"Neon-Teal",hex:"#2DD4BF"},
  {id:"violet",label:"Deep Violet",hex:"#8B5CF6"},
];
const BOOSTS = [{id:1,label:"1×",price:2},{id:3,label:"3×",price:5},{id:5,label:"5×",price:8}];

async function sha256(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error("read failed"));
    r.readAsDataURL(file);
  });
}
function slugify(s){
  return String(s).toLowerCase().trim().replace(/[^a-z0-9_-]/g,"").slice(0,24);
}

/* ---------- storage (localStorage — per-browser only, see note in chat) ---------- */
const LS_ACCOUNTS = "whalla:accounts";
const LS_SESSION = "whalla:session";
function getAccounts(){ try{ return JSON.parse(localStorage.getItem(LS_ACCOUNTS) || "{}"); }catch{ return {}; } }
function saveAccounts(obj){ try{ localStorage.setItem(LS_ACCOUNTS, JSON.stringify(obj)); return true; }catch{ return false; } }
function getSession(){ return localStorage.getItem(LS_SESSION) || null; }
function setSession(u){ localStorage.setItem(LS_SESSION, u); }
function clearSession(){ localStorage.removeItem(LS_SESSION); }

function subsKey(room){ return "whalla:room:"+room+":submissions"; }
function getSubs(room){ try{ return JSON.parse(localStorage.getItem(subsKey(room)) || "[]"); }catch{ return []; } }
function saveSubs(room, arr){ try{ localStorage.setItem(subsKey(room), JSON.stringify(arr)); return true; }catch(e){ return false; } }

function accentKey(room){ return "whalla:room:"+room+":accent"; }
function getAccent(room){ return localStorage.getItem(accentKey(room)) || "magenta"; }
function setAccent(room, id){ localStorage.setItem(accentKey(room), id); }

/* ---------- state ---------- */
let state = {
  route: parseHash(),
  authMode: "login", // login | register
  authError: null,
  boostTarget: null,
  storageWarning: false,
};
let pendingFile = null; // {name,type,size,dataUrl} for the currently-open submit form
let submitMode = "link";

function parseHash(){
  const h = location.hash.replace(/^#/, "");
  if(h.startsWith("room=")) return {view:"room", room: decodeURIComponent(h.slice(5))};
  if(h === "dashboard") return {view:"dashboard"};
  return {view:"landing"};
}
window.addEventListener("hashchange", () => { state.route = parseHash(); state.authError=null; render(); });

function currentAccentHex(room){
  const id = room ? getAccent(room) : "magenta";
  return (ACCENTS.find(a=>a.id===id) || ACCENTS[0]).hex;
}

/* ---------- render ---------- */
function render(){
  const app = document.getElementById("app");
  const session = getSession();
  let accentHex = "#FF2D78";
  if(state.route.view === "room") accentHex = currentAccentHex(state.route.room);
  else if(state.route.view === "dashboard" && session) accentHex = currentAccentHex(session);
  document.documentElement.style.setProperty("--accent", accentHex);

  let html = `<div class="spotbeam"></div><header><div class="wrap header-inner">
    <a href="#" class="logo" style="text-decoration:none;">
      <div class="logo-badge">🎤</div>
      <span class="display logo-text">WHALLA ICH HAB TALENT</span>
    </a>
    <div class="navbtns">
      <button class="navbtn ${state.route.view==='landing'?'active':''}" onclick="location.hash=''">Start</button>
      <button class="navbtn ${state.route.view==='dashboard'?'active':''}" onclick="goDashboard()">${session? 'Dashboard' : 'Login'}</button>
    </div>
  </div></header><main class="wrap">`;

  if(state.route.view === "landing") html += renderLanding();
  else if(state.route.view === "room") html += renderRoom(state.route.room);
  else if(state.route.view === "dashboard") html += renderDashboard();

  html += `</main>`;
  if(state.boostTarget) html += renderBoostModal();
  app.innerHTML = html;

  if(state.route.view === "room") wireSubmitForm(state.route.room);
}

function goDashboard(){
  if(getSession()) location.hash = "dashboard";
  else { location.hash = "dashboard"; }
}

function renderLanding(){
  const session = getSession();
  return `
    <div class="hero">
      <h1>DEIN EIGENER<br/><span style="color:var(--accent)">TALENT-RAUM</span></h1>
      <p>Erstelle einen Raum, teile deinen Link, und deine Zuschauer schicken dir live Musik — mit Boost-System zum Vordrängeln.</p>
    </div>
    <div class="stack" style="max-width:420px;margin:0 auto;">
      ${session ? `
        <div class="card center">
          <p style="margin:0 0 12px;color:var(--muted)">Eingeloggt als <strong>${esc(session)}</strong></p>
          <button class="btn btn-accent" onclick="location.hash='dashboard'">Zum Dashboard</button>
        </div>
      ` : renderAuthForm()}
    </div>
  `;
}

function renderAuthForm(){
  const isLogin = state.authMode === "login";
  return `
    <div class="card">
      <div class="togglegroup">
        <button class="togglebtn ${isLogin?'active':''}" onclick="setAuthMode('login')">Login</button>
        <button class="togglebtn ${!isLogin?'active':''}" onclick="setAuthMode('register')">Raum erstellen</button>
      </div>
      ${state.authError ? `<div class="banner banner-err">${esc(state.authError)}</div>` : ""}
      <form onsubmit="handleAuthSubmit(event)">
        <div class="field">
          <input type="text" id="auth-username" placeholder="Nutzername (wird dein Link)" autocomplete="username" />
        </div>
        <div class="field">
          <input type="password" id="auth-password" placeholder="Passwort" autocomplete="${isLogin?'current-password':'new-password'}" />
        </div>
        <button type="submit" class="btn btn-accent">${isLogin ? 'Einloggen' : 'Raum erstellen'}</button>
      </form>
      <p style="color:var(--muted2);font-size:11px;margin-top:12px;">Kein Google, keine E-Mail nötig — nur lokal in diesem Browser gespeichert. Kein Ersatz für echte Kontosicherheit.</p>
    </div>
  `;
}

function setAuthMode(m){ state.authMode = m; state.authError=null; render(); }

async function handleAuthSubmit(e){
  e.preventDefault();
  const uRaw = document.getElementById("auth-username").value.trim();
  const p = document.getElementById("auth-password").value;
  const username = slugify(uRaw);
  if(!username || username.length < 3){ state.authError = "Nutzername braucht mind. 3 Zeichen (a-z, 0-9, -, _)."; render(); return; }
  if(!p || p.length < 4){ state.authError = "Passwort braucht mind. 4 Zeichen."; render(); return; }

  const accounts = getAccounts();
  const hash = await sha256(p);

  if(state.authMode === "register"){
    if(accounts[username]){ state.authError = "Dieser Raum-Name ist schon vergeben. Anderen wählen oder einloggen."; render(); return; }
    accounts[username] = { passwordHash: hash, createdAt: Date.now() };
    if(!saveAccounts(accounts)){ state.authError = "Speichern fehlgeschlagen."; render(); return; }
    setSession(username);
    location.hash = "dashboard";
  } else {
    const acc = accounts[username];
    if(!acc || acc.passwordHash !== hash){ state.authError = "Nutzername oder Passwort falsch."; render(); return; }
    setSession(username);
    location.hash = "dashboard";
  }
}

function renderDashboard(){
  const session = getSession();
  if(!session) return renderLanding();
  const accent = currentAccentHex(session);
  const roomLink = location.origin + location.pathname + "#room=" + encodeURIComponent(session);
  const subs = getSubs(session);
  const pending = subs.filter(s=>s.status==="pending");
  const approved = subs.filter(s=>s.status==="approved").sort((a,b)=> (b.boosts-a.boosts) || (a.createdAt-b.createdAt));
  const played = subs.filter(s=>s.status==="played").sort((a,b)=>b.playedAt-a.playedAt).slice(0,6);

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div>
        <h2 class="display" style="font-size:1.6rem;margin:0;">STREAMER DASHBOARD</h2>
        <p style="color:var(--muted2);font-size:13px;margin:4px 0 0;">Raum: <span class="mono">${esc(session)}</span></p>
      </div>
      <button class="btn btn-ghost" style="width:auto;padding:8px 12px;font-size:12px;" onclick="doLogout()">Logout</button>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="section-label">🔗 Dein Raum-Link</div>
      <div class="roomlink"><span style="flex:1;">${esc(roomLink)}</span>
        <button class="btn-outline btn" onclick="copyLink('${esc(roomLink)}')">Kopieren</button>
      </div>
      <p style="color:var(--muted2);font-size:11px;margin-top:8px;">Teile diesen Link mit deinen Zuschauern — darüber können sie Songs schicken.</p>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="section-label">🎨 Bühnenlicht</div>
      <div class="accentgrid">
        ${ACCENTS.map(a=>`
          <div onclick="chooseAccent('${a.id}')">
            <div class="swatch" style="background:${a.hex};${a.hex===accent?`box-shadow:0 0 0 2px var(--card),0 0 0 4px ${a.hex};`:''}"></div>
            <div class="swatchlabel">${a.label}</div>
          </div>`).join("")}
      </div>
    </div>

    <div class="section-label">🛡️ Moderation (${pending.length})</div>
    ${pending.length===0 ? `<p class="empty">Keine neuen Einreichungen wartend.</p>` :
      pending.map((it,i)=>renderTicket(it,i,accent,true)).join("")}

    <div class="section-label" style="margin-top:22px;">👥 Live-Queue (${approved.length})</div>
    ${approved.length===0 ? `<p class="empty">Warteschlange leer — genehmige Einreichungen oben.</p>` :
      approved.map((it,i)=>renderTicket(it,i,accent,true)).join("")}

    ${played.length ? `
      <div class="section-label" style="margin-top:22px;">Zuletzt gespielt</div>
      ${played.map(it=>`<div style="color:var(--muted2);font-size:13px;padding:2px 0;">✓ ${esc(it.name)}</div>`).join("")}
    ` : ""}
  `;
}

function copyLink(link){
  navigator.clipboard?.writeText(link).then(()=>{
    const el = document.getElementById("app");
  }).catch(()=>{});
  alert("Link kopiert!");
}

function chooseAccent(id){
  const session = getSession();
  if(!session) return;
  setAccent(session, id);
  render();
}

function doLogout(){ clearSession(); location.hash = ""; }

function renderRoom(room){
  const accounts = getAccounts();
  if(!accounts[room]){
    return `<div class="card center"><p style="margin:0;">Diesen Raum gibt es nicht (mehr). Prüf den Link nochmal.</p></div>`;
  }
  const accent = currentAccentHex(room);
  const subs = getSubs(room);
  const live = subs.filter(s=>s.status==="approved" || s.status==="pending").sort((a,b)=>(b.boosts-a.boosts)||(a.createdAt-b.createdAt));

  return `
    <div class="hero">
      <h1>SCHICK DEINEN TRACK<br/>AUF DIE <span style="color:var(--accent)">BÜHNE</span></h1>
      <p>${live.length ? live.length+" Track"+(live.length===1?"":"s")+" in der Queue" : "Sei der Erste in der Queue"} · Raum von <span class="mono">${esc(room)}</span></p>
    </div>
    <div class="stack">
      <div class="card">
        <div class="section-label">🎵 Song einreichen</div>
        <p style="color:var(--muted);font-size:13px;margin:0 0 14px;">Link teilen oder Datei direkt hochladen.</p>
        <div class="togglegroup">
          <button type="button" class="togglebtn active" id="mode-link-btn" onclick="setSubmitMode('link')">Link</button>
          <button type="button" class="togglebtn" id="mode-file-btn" onclick="setSubmitMode('file')">Datei hochladen</button>
        </div>
        <form id="submit-form">
          <div class="field"><input type="text" id="f-name" placeholder="Dein Name" /></div>
          <div id="mode-link-wrap" class="field">
            <input type="text" id="f-link" placeholder="Link (Spotify / YouTube / SoundCloud)" />
          </div>
          <div id="mode-file-wrap" class="field" style="display:none;">
            <label class="filedrop" id="filedrop">
              <input type="file" id="f-file" accept="audio/*,video/*,image/*" style="display:none;" />
              <div class="fileicon">⬆</div>
              <div style="min-width:0;flex:1;">
                <p id="filedrop-title" style="margin:0;font-size:13px;color:var(--text);">Audio, Video oder Bild auswählen</p>
                <p id="filedrop-sub" style="margin:0;font-size:11px;color:var(--muted2);">Max. ${fmtBytes(MAX_FILE_BYTES)}</p>
              </div>
            </label>
            <div id="file-error" class="errtext" style="display:none;"></div>
          </div>
          <div class="field"><textarea id="f-message" rows="2" placeholder="Nachricht an den Streamer (optional)"></textarea></div>
          <div id="form-error" class="errtext" style="display:none;margin-bottom:8px;"></div>
          <button type="submit" class="btn btn-accent" id="submit-btn">✨ In die Queue schicken</button>
          <div id="form-ok" class="banner-ok" style="display:none;">Eingereicht! Der Streamer prüft deinen Track. 🎤</div>
        </form>
      </div>

      <div>
        <div class="section-label" style="color:var(--muted2);">Live-Warteschlange</div>
        ${live.length===0 ? `<p class="empty">Noch nichts eingereicht — sei die erste Person!</p>` :
          live.map((it,i)=>renderTicket(it,i,accent,false,room)).join("")}
      </div>
    </div>
  `;
}

function renderTicket(item, index, accent, moderate, room){
  const fileBlock = item.file ? `
    <div class="ticket-sub">${fileTypeEmoji(item.file.type)} ${esc(item.file.name)}</div>
    ${renderFilePreview(item.file)}
  ` : `<a href="${esc(item.link)}" target="_blank" rel="noopener noreferrer" class="ticket-sub">🔗 ${esc(item.link)}</a>`;

  let actions = "";
  if(moderate && item.status === "pending"){
    actions = `<div class="ticket-actions">
      <button class="iconbtn" style="background:rgba(45,212,191,0.13);color:var(--ok);" onclick="approveSub('${item.id}')">✓</button>
      <button class="iconbtn" style="background:var(--danger-bg);color:var(--danger);" onclick="rejectSub('${item.id}')">✕</button>
    </div>`;
  } else if(moderate && item.status === "approved"){
    actions = `<div class="ticket-actions">
      <button class="iconbtn" style="background:rgba(255,45,120,0.13);color:var(--accent);" onclick="playSub('${item.id}')">▶</button>
      <button class="iconbtn" style="background:rgba(255,255,255,0.06);color:var(--muted2);" onclick="dequeueSub('${item.id}')">🗑</button>
    </div>`;
  } else if(!moderate){
    actions = `<button class="btn btn-outline" style="flex-shrink:0;" onclick="openBoost('${item.id}')">🚀 Boost</button>`;
  }

  return `
    <div class="ticket">
      <div class="ticket-num mono">${index+1}</div>
      <div class="ticket-body">
        <div><span class="ticket-name">${esc(item.name)}</span>${item.boosts>0?`<span class="boostbadge mono">+${item.boosts} BOOST</span>`:""}</div>
        ${fileBlock}
        ${item.message ? `<div class="ticket-msg">"${esc(item.message)}"</div>` : ""}
      </div>
      ${actions}
    </div>
  `;
}

function fileTypeEmoji(type){
  if(type.startsWith("audio/")) return "🎧";
  if(type.startsWith("video/")) return "🎬";
  if(type.startsWith("image/")) return "🖼";
  return "📄";
}
function renderFilePreview(file){
  if(file.type.startsWith("audio/")) return `<audio controls src="${file.dataUrl}"></audio>`;
  if(file.type.startsWith("video/")) return `<video controls src="${file.dataUrl}"></video>`;
  if(file.type.startsWith("image/")) return `<img class="filepreview" src="${file.dataUrl}" alt="${esc(file.name)}" />`;
  return `<a href="${file.dataUrl}" download="${esc(file.name)}" style="font-size:12px;color:var(--accent);">Datei herunterladen</a>`;
}

/* ---------- submit form wiring (uncontrolled, so typing doesn't trigger full re-render) ---------- */
function setSubmitMode(mode){
  submitMode = mode;
  document.getElementById("mode-link-btn").classList.toggle("active", mode==="link");
  document.getElementById("mode-file-btn").classList.toggle("active", mode==="file");
  document.getElementById("mode-link-wrap").style.display = mode==="link" ? "block" : "none";
  document.getElementById("mode-file-wrap").style.display = mode==="file" ? "block" : "none";
}

function wireSubmitForm(room){
  pendingFile = null;
  submitMode = "link";
  const fileInput = document.getElementById("f-file");
  const filedrop = document.getElementById("filedrop");
  if(!fileInput) return;

  fileInput.addEventListener("change", async (e) => {
    const f = e.target.files?.[0];
    e.target.value = "";
    if(!f) return;
    const errEl = document.getElementById("file-error");
    errEl.style.display = "none";
    if(f.size > MAX_FILE_BYTES){
      errEl.textContent = `Datei ist zu groß (${fmtBytes(f.size)}). Maximal ${fmtBytes(MAX_FILE_BYTES)}.`;
      errEl.style.display = "block";
      return;
    }
    try{
      const dataUrl = await fileToDataUrl(f);
      pendingFile = { name: f.name, type: f.type || "application/octet-stream", size: f.size, dataUrl };
      filedrop.classList.add("hasfile");
      document.getElementById("filedrop-title").textContent = f.name;
      document.getElementById("filedrop-sub").textContent = fmtBytes(f.size);
    }catch{
      errEl.textContent = "Datei konnte nicht gelesen werden. Nochmal versuchen?";
      errEl.style.display = "block";
    }
  });

  document.getElementById("submit-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("f-name").value.trim();
    const link = document.getElementById("f-link").value.trim();
    const message = document.getElementById("f-message").value.trim();
    const formErr = document.getElementById("form-error");
    const linkValid = /^(https?:\/\/)?(www\.)?(open\.spotify\.com|youtu\.be|youtube\.com|soundcloud\.com)\/.+/i.test(link);

    document.getElementById("f-name").classList.toggle("err", !name);
    if(!name){ formErr.textContent = "Bitte deinen Namen eintragen."; formErr.style.display="block"; return; }

    if(submitMode === "link"){
      document.getElementById("f-link").classList.toggle("err", !linkValid);
      if(!linkValid){ formErr.textContent = "Bitte einen gültigen Spotify-, YouTube- oder SoundCloud-Link einfügen."; formErr.style.display="block"; return; }
    } else {
      if(!pendingFile){ formErr.textContent = "Bitte eine Datei auswählen."; formErr.style.display="block"; return; }
    }
    formErr.style.display = "none";

    const item = {
      id: uid(), name, message,
      link: submitMode === "link" ? link : "",
      file: submitMode === "file" ? pendingFile : null,
      status: "pending", boosts: 0, createdAt: Date.now(),
    };
    const subs = getSubs(room);
    subs.push(item);
    const ok = saveSubs(room, subs);
    if(!ok){
      formErr.textContent = "Speichern fehlgeschlagen — evtl. ist der lokale Speicher voll (Dateien sind groß). Versuch eine kleinere Datei oder einen Link.";
      formErr.style.display = "block";
      return;
    }

    document.getElementById("submit-form").reset();
    pendingFile = null;
    filedrop && filedrop.classList.remove("hasfile");
    if(document.getElementById("filedrop-title")) document.getElementById("filedrop-title").textContent = "Audio, Video oder Bild auswählen";
    if(document.getElementById("filedrop-sub")) document.getElementById("filedrop-sub").textContent = "Max. " + fmtBytes(MAX_FILE_BYTES);
    document.getElementById("form-ok").style.display = "block";
    setTimeout(render, 50); // refresh the queue list beneath the form
  });
}

/* ---------- moderation / queue actions ---------- */
function updateSub(room, id, patch){
  const subs = getSubs(room);
  const idx = subs.findIndex(s=>s.id===id);
  if(idx===-1) return;
  subs[idx] = {...subs[idx], ...patch};
  saveSubs(room, subs);
  render();
}
function removeSub(room, id){
  const subs = getSubs(room).filter(s=>s.id!==id);
  saveSubs(room, subs);
  render();
}
function approveSub(id){ updateSub(getSession(), id, {status:"approved"}); }
function rejectSub(id){ removeSub(getSession(), id); }
function playSub(id){ updateSub(getSession(), id, {status:"played", playedAt: Date.now()}); }
function dequeueSub(id){ removeSub(getSession(), id); }

/* ---------- boost modal ---------- */
function openBoost(id){
  const room = state.route.room;
  const item = getSubs(room).find(s=>s.id===id);
  if(!item) return;
  state.boostTarget = { room, id, name: item.name, choice: BOOSTS[1], stage: "pick" };
  render();
}
function closeBoost(){ state.boostTarget = null; render(); }
function pickBoost(bid){
  state.boostTarget.choice = BOOSTS.find(b=>b.id===bid);
  render();
}
function payBoost(){
  state.boostTarget.stage = "paying";
  render();
  setTimeout(()=>{
    state.boostTarget.stage = "done";
    render();
    setTimeout(()=>{
      const {room,id,choice} = state.boostTarget;
      const subs = getSubs(room);
      const idx = subs.findIndex(s=>s.id===id);
      if(idx!==-1){ subs[idx].boosts = (subs[idx].boosts||0) + choice.id; saveSubs(room, subs); }
      state.boostTarget = null;
      render();
    }, 700);
  }, 900);
}
function renderBoostModal(){
  const t = state.boostTarget;
  if(t.stage === "paying"){
    return `<div class="modal-overlay"><div class="modal center" style="padding:40px 20px;">
      <div style="font-size:28px;">⏳</div>
      <p style="color:var(--muted);margin-top:10px;">Zahlung wird verarbeitet…</p>
    </div></div>`;
  }
  if(t.stage === "done"){
    return `<div class="modal-overlay"><div class="modal center" style="padding:40px 20px;">
      <div style="width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:22px;color:#0B0B0F;">✓</div>
      <p style="font-weight:700;margin:0 0 4px;">Geboostet!</p>
      <p style="color:var(--muted);font-size:13px;margin:0;">Track springt in der Queue nach vorn 🚀</p>
    </div></div>`;
  }
  return `<div class="modal-overlay">
    <div class="modal">
      <button onclick="closeBoost()" style="position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted2);font-size:16px;cursor:pointer;">✕</button>
      <p style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted2);margin:0 0 4px;">Boost für</p>
      <h3 style="margin:0 0 14px;font-size:1.1rem;">${esc(t.name)}'s Track</h3>
      <div class="boostgrid">
        ${BOOSTS.map(b=>`
          <div class="boostopt ${t.choice.id===b.id?'sel':''}" onclick="pickBoost(${b.id})">
            <div class="mono" style="font-weight:800;">${b.label}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px;">${b.price} €</div>
          </div>`).join("")}
      </div>
      <button class="btn btn-accent" onclick="payBoost()">🚀 Jetzt vordrängeln — ${t.choice.price} €</button>
      <p style="text-align:center;font-size:10px;color:var(--muted2);margin-top:10px;">Demo-Zahlung · es wird nichts abgebucht</p>
    </div>
  </div>`;
}

/* ---------- boot ---------- */
render();
</script>
