<style>
:root{--bg:#070709;--card:#111116;--text:#f7f7f4;--muted:#8f8f98;--border:#24242c;--accent:#fff;--street:#fff;--shit:#ff315d;--ok:#2dd4bf}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#24242b 0,#070709 38%);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:0 16px}.top{position:sticky;top:0;z-index:20;background:rgba(7,7,9,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.head{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:900}.brand img{width:46px;height:46px;object-fit:cover;border-radius:50%;border:1px solid #444}.brand span{font-size:13px;letter-spacing:.08em}
.nav{display:flex;gap:5px;background:#111116;border:1px solid var(--border);padding:4px;border-radius:99px}.nav button,.pill{border:0;background:transparent;color:#aaa;padding:8px 11px;border-radius:99px;font-weight:800;cursor:pointer}.nav .on{background:#fff;color:#000}
main{padding:30px 0 70px}.hero{text-align:center;margin:15px 0 30px}.hero img{width:135px;height:135px;object-fit:cover;border-radius:50%;border:1px solid #333;box-shadow:0 0 45px rgba(255,255,255,.08)}h1{font-size:clamp(34px,9vw,64px);line-height:.9;margin:18px 0 10px;letter-spacing:-.04em}.hero p{color:#9b9ba2;margin:0 auto;max-width:560px;line-height:1.5}
.card{background:rgba(17,17,22,.94);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:16px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#aaa;font-weight:900;margin-bottom:10px}
input,textarea{width:100%;background:#08080b;color:#fff;border:1px solid #292930;border-radius:11px;padding:13px;font:inherit;outline:none;margin-bottom:9px}input:focus,textarea:focus{border-color:#777}.btn{width:100%;border:0;border-radius:11px;padding:13px;font-weight:900;cursor:pointer}.white{background:#fff;color:#000}.ghost{background:#17171d;color:#fff;border:1px solid #2c2c33}.tabs{display:flex;gap:5px;background:#08080b;border-radius:99px;padding:4px;margin-bottom:13px}.tabs button{flex:1;border:0;background:transparent;color:#888;padding:9px;border-radius:99px;font-weight:900;cursor:pointer}.tabs .active{background:#fff;color:#000}
.file{border:1.5px dashed #3a3a43;background:#08080b;padding:17px;border-radius:12px;display:flex;gap:12px;align-items:center;cursor:pointer}.file strong{display:block;font-size:13px}.file small{display:block;color:#777;margin-top:3px}.fileicon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#000;font-size:19px}.err{color:#ff6b7f;font-size:12px;margin:4px 0 9px}.ok{color:#2dd4bf;font-size:12px;text-align:center;margin-top:9px}
.ticket{background:#0d0d11;border:1px solid #22222a;border-radius:15px;padding:14px;margin:9px 0}.tickettop{display:flex;gap:11px;align-items:flex-start}.num{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:#18181e;color:#fff;font-weight:900;flex:none}.body{min-width:0;flex:1}.name{font-weight:900}.sub{font-size:12px;color:#85858d;margin-top:3px;word-break:break-word}.msg{font-size:12px;color:#aaa;margin-top:7px}.actions{display:flex;gap:6px}.mini{border:0;border-radius:9px;width:34px;height:34px;cursor:pointer;font-weight:900}.play{background:#fff;color:#000}.danger{background:#32121a;color:#ff6b7f}.audio{width:100%;margin-top:12px;display:block}.audioRow{display:flex;gap:8px;align-items:center;margin-top:10px}.audioRow .audio{margin-top:0;flex:1}.listen{border:0;border-radius:10px;background:#fff;color:#000;padding:10px 13px;font-weight:900;cursor:pointer;white-space:nowrap}.listen:active{transform:scale(.96)}.rateTitle{font-size:11px;color:#777;margin-top:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.rate button.selected{outline:2px solid #fff;box-shadow:0 0 22px rgba(255,255,255,.18)}.rate{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.rate button{position:relative;overflow:hidden;border:1px solid #292930;background:#15151a;color:#fff;border-radius:12px;padding:12px 8px;font-weight:1000;cursor:pointer;transition:transform .15s}.rate button:active{transform:scale(.94)}.street:hover{box-shadow:0 0 25px rgba(255,255,255,.13)}.shit:hover{box-shadow:0 0 25px rgba(255,49,93,.2)}.count{display:block;color:#888;font-size:11px;margin-top:3px}
@keyframes streetPop{0%{transform:scale(1)}35%{transform:scale(1.14) rotate(-2deg)}70%{transform:scale(.97) rotate(2deg)}100%{transform:scale(1)}}@keyframes shitPop{0%{transform:scale(1)}25%{transform:rotate(-5deg) scale(1.12)}50%{transform:rotate(5deg) scale(1.08)}75%{transform:rotate(-3deg) scale(1.03)}100%{transform:scale(1)}}@keyframes burst{0%{opacity:0;transform:scale(.3)}50%{opacity:1}100%{opacity:0;transform:scale(1.8)}}.street.pop{animation:streetPop .55s}.shit.pop{animation:shitPop .55s}.flash{position:absolute;inset:0;pointer-events:none;animation:burst .6s ease-out;border-radius:12px;background:radial-gradient(circle,#fff8 0,transparent 65%)}
.queueTitle{display:flex;justify-content:space-between;align-items:center}.badge{font-size:11px;background:#1b1b22;border-radius:99px;padding:5px 8px;color:#aaa}.empty{color:#666;font-size:13px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:50}.modal>div{width:100%;max-width:400px;background:#121217;border:1px solid #292930;border-radius:18px;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.grid button{background:#17171d;color:#fff;border:1px solid #292930;border-radius:11px;padding:12px;cursor:pointer}.grid .sel{border-color:#fff;background:#fff;color:#000}.hide{display:none!important}.notice{font-size:11px;color:#777;line-height:1.5;margin-top:10px}

/* V3 polish */
:root{--green:#22c55e;--gold:#facc15}
body{overflow-x:hidden}.wrap{width:100%}
.glowline{height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:.22}
.hero .eyebrow{display:inline-flex;gap:7px;align-items:center;border:1px solid #2c2c33;background:#101015;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#ccc}
.hero h1{ text-shadow:0 0 28px rgba(255,255,255,.08)}
.pulseDot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:dotPulse 1.6s infinite}
@keyframes dotPulse{50%{transform:scale(1.5);opacity:.55}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#0b0b0f;border:1px solid #22222a;border-radius:13px;padding:12px}.stat b{font-size:20px;display:block}.stat span{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.08em}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #2b2b33;background:#101015;color:#aaa;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900;cursor:pointer}.chip.active{background:#fff;color:#000;border-color:#fff}
.progress{height:7px;background:#08080b;border:1px solid #25252c;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:#fff;transition:width .2s}
.file.drag{border-color:#fff;background:#15151a;transform:scale(1.01)}.file input{position:absolute;opacity:0;width:1px;height:1px}.file{position:relative}
.audioCard{margin-top:9px;background:#08080b;border:1px solid #24242b;border-radius:12px;padding:10px}.audioCard audio{margin:0;width:100%}.now{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));z-index:40;background:rgba(14,14,18,.96);backdrop-filter:blur(16px);border:1px solid #33333b;border-radius:16px;padding:10px 12px;box-shadow:0 15px 50px #000c;display:none}.now.show{display:block}.nowTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.nowTitle{font-weight:900;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowSub{font-size:10px;color:#777;margin-top:2px}.nowClose{border:0;background:#22222a;color:#aaa;border-radius:9px;width:30px;height:30px;cursor:pointer}.now audio{width:100%;margin-top:7px}.toast{position:fixed;left:50%;top:82px;transform:translate(-50%,-12px);opacity:0;pointer-events:none;z-index:100;background:#fff;color:#000;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:900;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){.head{height:62px}.brand span{display:none}.nav button{padding:8px 9px}.card{padding:16px;border-radius:16px}.stats{gap:6px}.stat{padding:10px}.stat b{font-size:18px}.audioRow{display:block}.listen{width:100%;margin-bottom:7px}.now{bottom:8px}.hero img{width:112px;height:112px}}

/* ===== V4: moderneres Design, Medaillen, Player, Animationen, iPhone-Politur ===== */
:root{--gold:#ffd447;--silver:#d7dbe3;--bronze:#e0894f;--street2:#7dffb0}
html{-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
.top{padding-top:env(safe-area-inset-top)}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1{font-family:Arial,Helvetica,sans-serif;font-weight:900}
.hero .eyebrow{background:linear-gradient(180deg,#141419,#0c0c10)}

/* Karten mit dezentem Glow + Hover */
.card{position:relative;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 20px 45px -25px rgba(0,0,0,.8);transition:border-color .2s}
.card:focus-within{border-color:#3a3a44}

/* Ticket-Karten V4 */
.ticket{position:relative;overflow:hidden;transition:transform .18s,border-color .18s}
.ticket.mine{border-color:#4c4c58;background:linear-gradient(180deg,#121218,#0d0d11)}
.ticket.mine::before{content:"DEIN SONG";position:absolute;top:10px;right:12px;font-size:9px;font-weight:900;letter-spacing:.1em;color:#9d9da6;background:#1c1c22;border:1px solid #2f2f38;padding:4px 7px;border-radius:99px}
.num{font-size:15px;transition:transform .2s}
.num.medal{background:transparent;font-size:22px;box-shadow:none}
.num.g{background:radial-gradient(circle at 30% 30%,#fff2b8,var(--gold) 65%);color:#3a2a00;box-shadow:0 0 16px rgba(255,212,71,.55)}
.num.s{background:radial-gradient(circle at 30% 30%,#f4f6fa,var(--silver) 65%);color:#33333a;box-shadow:0 0 14px rgba(215,219,227,.45)}
.num.b{background:radial-gradient(circle at 30% 30%,#f3b085,var(--bronze) 65%);color:#3a1c04;box-shadow:0 0 14px rgba(224,137,79,.4)}
.num.g,.num.s,.num.b{font-size:17px;display:grid;place-items:center}

/* Warteschlangen-Status-Karte (eigener Song) */
.myqueue{border:1px solid #33333d;background:radial-gradient(120% 140% at 0% 0%,#191922 0,#0c0c10 60%);border-radius:18px;padding:20px;margin-bottom:16px}
.myqueue .mq-top{display:flex;align-items:center;gap:12px}
.mq-pos{font-size:38px;font-weight:1000;line-height:1;min-width:56px;text-align:center}
.mq-pos.g{color:var(--gold);text-shadow:0 0 18px rgba(255,212,71,.5)}.mq-pos.s{color:var(--silver);text-shadow:0 0 16px rgba(215,219,227,.4)}.mq-pos.b{color:var(--bronze);text-shadow:0 0 16px rgba(224,137,79,.4)}
.mq-label{font-size:11px;color:#8a8a92;text-transform:uppercase;letter-spacing:.1em;font-weight:900}
.mq-sub{font-size:13px;color:#c6c6cc;margin-top:2px}
.mq-progress{height:6px;border-radius:99px;background:#0a0a0d;border:1px solid #232329;overflow:hidden;margin-top:14px}
.mq-progress i{display:block;height:100%;background:linear-gradient(90deg,#fff,#bdbdc6);transition:width .4s}
.mq-hint{font-size:11.5px;color:#77777f;margin-top:10px;line-height:1.5}
.mq-cancel{margin-top:12px;background:none;border:1px solid #2c2c33;color:#9c9ca4;font-size:11px;font-weight:800;border-radius:9px;padding:8px 10px;cursor:pointer}

/* Upload-Erfolgs-Overlay */
.successOverlay{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(5,5,7,.72);backdrop-filter:blur(6px);padding:20px}
.successOverlay.show{display:grid}
.successCard{background:#101014;border:1px solid #2c2c34;border-radius:22px;padding:30px 26px;text-align:center;max-width:340px;width:100%;animation:successIn .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes successIn{0%{opacity:0;transform:scale(.82) translateY(14px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.successCheck{width:64px;height:64px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:30px;margin:0 auto 14px;animation:checkPop .5s .05s both}
@keyframes checkPop{0%{transform:scale(0)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.successCard h3{margin:0 0 6px;font-size:19px}
.successCard p{color:#999;font-size:13px;margin:0 0 16px;line-height:1.5}
.successCard button{width:100%;border:0;background:#fff;color:#000;border-radius:11px;padding:13px;font-weight:900;cursor:pointer}

/* Konfetti-Partikel bei Bewertung */
.particle{position:absolute;pointer-events:none;font-size:16px;z-index:5;animation:particleFly .85s ease-out forwards}
@keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(.6) rotate(0)}100%{opacity:0;transform:var(--pend) scale(1.1) rotate(var(--prot))}}
.rate button.street.pop{box-shadow:0 0 30px rgba(125,255,176,.35)}
.rate button.shit.pop{box-shadow:0 0 30px rgba(255,49,93,.4)}
.rate button.selected.street{background:linear-gradient(180deg,#132018,#0d0d11);border-color:var(--street2)}
.rate button.selected.shit{background:linear-gradient(180deg,#241017,#0d0d11);border-color:var(--shit)}

/* Bewertungs-Buttons als Logo-Stempel */
.rate button{padding:14px 6px 10px;overflow:visible;background:radial-gradient(120% 100% at 50% 0%,#17171d 0,#0a0a0d 100%)}
.rate button .rateImg{width:100%;height:auto;display:block;pointer-events:none;filter:drop-shadow(0 3px 10px rgba(0,0,0,.6));transform:scale(1);transition:transform .12s}
.rate button:active .rateImg{transform:scale(.92)}
.rate button.street{border-color:#2a2a30}
.rate button.shit{border-color:#2a2a30}
.rate button.street:hover .rateImg,.rate button.shit:hover .rateImg{filter:drop-shadow(0 3px 10px rgba(0,0,0,.6)) brightness(1.08)}
@keyframes smashStreet{0%{transform:scale(1) rotate(0)}18%{transform:scale(.78) rotate(-3deg)}40%{transform:scale(1.22) rotate(2deg)}62%{transform:scale(.94) rotate(-1deg)}80%{transform:scale(1.05) rotate(.5deg)}100%{transform:scale(1) rotate(0)}}
@keyframes smashShit{0%{transform:scale(1) rotate(0)}15%{transform:scale(.7) rotate(4deg)}35%{transform:scale(1.25) rotate(-5deg)}55%{transform:scale(.9) rotate(3deg)}75%{transform:scale(1.08) rotate(-1.5deg)}100%{transform:scale(1) rotate(0)}}
.rate button.street.pop .rateImg{animation:smashStreet .5s cubic-bezier(.2,1.6,.4,1)}
.rate button.shit.pop .rateImg{animation:smashShit .5s cubic-bezier(.2,1.6,.4,1)}
.rate button.street.pop{animation:none;box-shadow:0 0 40px rgba(200,205,215,.5)}
.rate button.shit.pop{animation:none;box-shadow:0 0 40px rgba(255,49,93,.55)}
.impactFlash{position:absolute;inset:-6px;pointer-events:none;border-radius:14px;z-index:6;opacity:0;animation:impactFlashAnim .45s ease-out forwards}
@keyframes impactFlashAnim{0%{opacity:.9;background:radial-gradient(circle,#fff 0,transparent 70%)}100%{opacity:0;background:radial-gradient(circle,#fff 0,transparent 70%)}}
.shake{animation:shakeTicket .4s}
@keyframes shakeTicket{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}

/* Besserer Player (unten fixiert) */
.now{padding:12px 14px 12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-radius:20px}
.nowMain{display:flex;align-items:center;gap:11px}
.nowPlay{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#000;display:grid;place-items:center;font-size:15px;cursor:pointer}
.nowPlay:active{transform:scale(.92)}
.nowInfo{min-width:0;flex:1}
.nowBar{position:relative;height:5px;border-radius:99px;background:#28282f;margin-top:9px;cursor:pointer}
.nowBar i{position:absolute;left:0;top:0;height:100%;border-radius:99px;background:#fff;width:0%}
.nowBar .knob{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);left:0%;box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.nowTimes{display:flex;justify-content:space-between;font-size:10px;color:#777;margin-top:5px;font-variant-numeric:tabular-nums}

/* Listen-Button / audioCard modern */
.audioCard{display:flex;align-items:center;gap:10px;padding:10px 12px}
.listen{width:auto;flex:none;border-radius:50%;width:40px;height:40px;padding:0;font-size:14px;display:grid;place-items:center}
.audioCard .miniMeta{flex:1;min-width:0}
.audioCard .miniBar{height:4px;background:#1c1c22;border-radius:99px;margin-top:7px;overflow:hidden}
.audioCard .miniBar i{display:block;height:100%;width:0%;background:#666}
.audioCard.playing .miniBar i{background:#fff}
.audioCard.playing .listen{background:var(--street2);color:#0a1a10}

/* Bell / Benachrichtigung Streamer */
.bellDot{position:relative}
.bellDot::after{content:"";position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--shit);display:none}
.bellDot.on::after{display:block;animation:dotPulse 1.2s infinite}

@media(max-width:520px){.myqueue{padding:16px}.mq-pos{font-size:32px;min-width:46px}.successCard{padding:24px 20px}}
@media(prefers-reduced-motion:reduce){.street.pop,.shit.pop,.particle,.successCheck,.successCard{animation:none!important}}
</style>
</head>

let pendingFile=null;

function mySubKey(room){return "street_my_sub_"+room}
function getMySubId(room){return localStorage.getItem(mySubKey(room))||null}
function setMySubId(room,id){localStorage.setItem(mySubKey(room),id)}
function clearMySubId(room){localStorage.removeItem(mySubKey(room))}

function beep(){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const t=audioCtx.currentTime;
  [0,.14].forEach((d,i)=>{
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type="sine";o.frequency.setValueAtTime(i===0?880:1180,t+d);
   g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.18,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.32);
   o.connect(g);g.connect(audioCtx.destination);o.start(t+d);o.stop(t+d+.34);
  });
 }catch(e){}
}

function spawnParticles(btn,emoji){
 const rect=btn.getBoundingClientRect();
 for(let i=0;i<10;i++){
  const p=document.createElement("span");p.className="particle";p.textContent=emoji;
  const ang=(Math.random()*Math.PI*2),dist=40+Math.random()*46;
  p.style.setProperty("--pend",`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist-20}px)`);
  p.style.setProperty("--prot",(Math.random()*140-70)+"deg");
  p.style.left=(rect.width/2)+"px";p.style.top=(rect.height/2)+"px";p.style.fontSize=(13+Math.random()*10)+"px";
  btn.appendChild(p);setTimeout(()=>p.remove(),900);
 }
}

const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();
function voterId(){let v=localStorage.getItem("street_voter_id");if(!v){v=uid();localStorage.setItem("street_voter_id",v)}return v}
function parse(){let h=location.hash.replace(/^#/,"");if(h.startsWith("room=")){state.view="room";state.room=decodeURIComponent(h.slice(5))}else if(h==="dashboard"){state.view="dashboard"}else{state.view="landing"}}
function ownerToken(){return localStorage.getItem("street_owner_token")||""}
function setOwner(t){localStorage.setItem("street_owner_token",t)}
function clearOwner(){localStorage.removeItem("street_owner_token")}
function goDashboard(){location.hash="dashboard"}
window.addEventListener("hashchange",()=>{parse();render()});

function authForm(){
return `<div class="card"><div class="tabs"><button class="${state.auth==="login"?"active":""}" onclick="state.auth='login';render()">Login</button><button class="${state.auth==="register"?"active":""}" onclick="state.auth='register';render()">Raum erstellen</button></div>
<form onsubmit="authSubmit(event)"><input id="authUser" placeholder="Raumname, z. B. berlin" required><input id="authPass" type="password" placeholder="Passwort" required minlength="4"><div id="authErr" class="err"></div><button class="btn white" type="submit">${state.auth==="login"?"Einloggen":"Raum erstellen"}</button></form>
<p class="notice">Dein Raum bekommt einen eigenen Link. Songs und Bewertungen werden online gespeichert.</p></div>`;
}
async function authSubmit(e){
e.preventDefault();
let errEl=document.getElementById("authErr");
if(errEl) errEl.textContent="";
if(!sb){if(errEl) errEl.textContent="Supabase ist noch nicht richtig verbunden. Prüfe URL und Publishable/Anon Key in index.html.";return;}
let raw=document.getElementById("authUser").value.trim();
let slug=raw.toLowerCase().replace(/[^a-z0-9_-]/g,"").slice(0,30),pass=document.getElementById("authPass").value;
if(slug.length<3){if(errEl) errEl.textContent="Raumname: mindestens 3 Zeichen (a-z, 0-9, - oder _).";return;}
let fn=state.auth==="register"?"register_room":"login_room";
try{
  let {data,error}=await sb.rpc(fn,{p_slug:slug,p_password:pass});
  if(error){if(errEl) errEl.textContent="Fehler: "+error.message;return;}
  if(!data?.owner_token){if(errEl) errEl.textContent="Raum wurde nicht erstellt. Prüfe, ob supabase_setup.sql vollständig ausgeführt wurde.";return;}
  setOwner(data.owner_token);location.hash="dashboard";
}catch(ex){if(errEl) errEl.textContent="Verbindungsfehler: "+(ex?.message||ex);}
}

async function roomExists(room){
if(!sb) return null;
const {data,error}=await sb.from("rooms").select("slug,accent").eq("slug",room).maybeSingle();
return error?null:data;
}
function dashboard(){
let token=ownerToken(); if(!token)return authForm();
return `<div class="card"><div class="queueTitle"><div><div class="label">🎙️ Streamer-Zentrale</div><h2 style="margin:0">100 PROZENT STRASSE</h2><div style="color:#777;font-size:12px;margin-top:4px">Hier hörst du jeden Track und entscheidest: Straße oder Scheiße.</div></div><button class="pill" onclick="logout()">Logout</button></div>
<div class="stats"><div class="stat"><b id="statTotal">–</b><span>Tracks</span></div><div class="stat"><b id="statPending">–</b><span>Warten</span></div><div class="stat"><b id="statApproved">–</b><span>Online</span></div></div>
<div style="margin-top:15px"><input id="roomLink" readonly><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><button class="btn white" onclick="copyRoom()">🔗 Link kopieren</button><button class="btn ghost" onclick="shareRoom()">📤 Teilen</button></div></div></div>
<div class="card"><div class="queueTitle"><div class="label" style="margin:0">🔥 Moderation</div><div style="display:flex;gap:6px"><button class="pill bellDot ${soundEnabled()?"on":""}" id="soundToggle" onclick="toggleSound()" title="Sound bei neuem Song">🔔</button><button class="pill" onclick="loadDashboard()">↻ Aktualisieren</button></div></div><div class="tools"><button class="chip active" data-dfilter="all" onclick="setDashFilter('all')">Alle</button><button class="chip" data-dfilter="pending" onclick="setDashFilter('pending')">⏳ Warten</button><button class="chip" data-dfilter="approved" onclick="setDashFilter('approved')">✓ Online</button></div><div id="dashboardQueue"><p class="empty">Lade Songs…</p></div></div>`;
}

function soundEnabled(){return localStorage.getItem("street_sound")!=="off"}
function toggleSound(){localStorage.setItem("street_sound",soundEnabled()?"off":"on");const b=document.getElementById("soundToggle");if(b)b.classList.toggle("on",soundEnabled());toast(soundEnabled()?"🔔 Sound an":"🔕 Sound aus")}

async function loadDashboard(){
if(state.view!=="dashboard"||!ownerToken()||!sb)return;
let {data,error}=await sb.rpc("owner_room",{p_owner_token:ownerToken()});
if(error||!data?.slug){clearOwner();render();return}
let link=location.origin+location.pathname+"#room="+encodeURIComponent(data.slug);
const roomLink=document.getElementById("roomLink");if(roomLink)roomLink.value=link;
let {data:subs}=await sb.from("submissions").select("*").eq("room_slug",data.slug).in("status",["pending","approved"]).order("boosts",{ascending:false}).order("created_at",{ascending:true});
subs=subs||[];state.dashSubs=subs;
let pending=subs.filter(s=>s.status==="pending").length, approved=subs.filter(s=>s.status==="approved").length;
for(const [id,val] of [["statTotal",subs.length],["statPending",pending],["statApproved",approved]]){let e=document.getElementById(id);if(e)e.textContent=val}
let pendingIds=new Set(subs.filter(s=>s.status==="pending").map(s=>s.id));
if(state.dashKnownIds){
 let fresh=[...pendingIds].filter(id=>!state.dashKnownIds.has(id));
 if(fresh.length&&soundEnabled()){beep();toast(fresh.length>1?`🔔 ${fresh.length} neue Songs sind da!`:"🔔 Neuer Song ist da!")}
}
state.dashKnownIds=pendingIds;
renderDashboardQueue();
}
function setDashFilter(f){state.dashFilter=f;document.querySelectorAll('[data-dfilter]').forEach(b=>b.classList.toggle('active',b.dataset.dfilter===f));renderDashboardQueue()}
function renderDashboardQueue(){
let el=document.getElementById("dashboardQueue");if(!el)return;let subs=state.dashSubs||[];if(state.dashFilter!=="all")subs=subs.filter(s=>s.status===state.dashFilter);
el.innerHTML=subs.map((s,i)=>ticket(s,i,true)).join("")||`<p class="empty">Keine Tracks in diesem Bereich.</p>`;
}
function logout(){clearOwner();location.hash=""}
function copyRoom(){let v=document.getElementById("roomLink")?.value||"";if(navigator.clipboard)navigator.clipboard.writeText(v).then(()=>toast("Link kopiert 🔗"));else{document.getElementById("roomLink")?.select();document.execCommand("copy");toast("Link kopiert 🔗")}}
async function shareRoom(){let v=document.getElementById("roomLink")?.value||"";try{if(navigator.share)await navigator.share({title:"100 PROZENT STRASSE",text:"Bewerte meinen Track auf 100 PROZENT STRASSE",url:v});else copyRoom()}catch(e){}}
function toast(t){let e=document.getElementById("toast");if(!e)return;e.textContent=t;e.classList.add("show");clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove("show"),1800)}

function medalClass(pos){return pos===1?"g":pos===2?"s":pos===3?"b":""}
function medalEmoji(pos){return pos===1?"🥇":pos===2?"🥈":pos===3?"🥉":""}

function myQueueCard(sub){
 let pos=sub.position||1,total=Math.max(sub.total||1,pos),mc=medalClass(pos),me=medalEmoji(pos);
 let pct=total>1?Math.round(((total-pos)/(total-1))*100):100;
 let statusTxt=sub.status==="pending"?"⏳ wartet auf Freigabe durch den Streamer":"✓ freigegeben – wartet aufs Abspielen";
 return `<div class="myqueue"><div class="mq-top"><div class="mq-pos ${mc}">${me||('#'+pos)}</div><div><div class="mq-label">📋 Dein Song ist in der Schlange</div><div class="mq-sub">„${esc(sub.name)}“ · Platz ${pos} von ${total}</div><div class="mq-sub" style="color:#777">${statusTxt}</div></div></div>
<div class="mq-progress"><i style="width:${pct}%"></i></div>
<div class="mq-hint">🎧 Sobald dein Track einmal abgespielt wurde, kannst du den nächsten Song schicken.</div>
<button class="mq-cancel" onclick="forgetMySub()">Anderen Song einreichen</button></div>`;
}
function forgetMySub(){clearMySubId(state.room);state.mySub=null;render()}

function submitCard(){
 if(state.mySub) return myQueueCard(state.mySub);
 return `<div class="card"><div class="label">🎵 Song einreichen</div><div class="tabs"><button id="linkTab" class="${state.mode==="link"?"active":""}" onclick="setMode('link')">Link</button><button id="fileTab" class="${state.mode==="file"?"active":""}" onclick="setMode('file')">MP3 / WAV</button></div>
<form id="submitForm" onsubmit="submitSong(event)"><input id="name" placeholder="Dein Name" required>
<div id="linkWrap" class="${state.mode==="link"?"":"hide"}"><input id="link" placeholder="Spotify / YouTube / SoundCloud Link"></div>
<div id="fileWrap" class="${state.mode==="file"?"":"hide"}"><label class="file"><input id="file" type="file" accept="audio/mpeg,audio/wav,.mp3,.wav" onchange="pickFile(event)"><div class="fileicon">↑</div><div><strong id="fileName">MP3 oder WAV auswählen</strong><small id="fileInfo">Maximal 50 MB</small></div></label></div>
<textarea id="message" rows="2" placeholder="Nachricht (optional)"></textarea><div id="submitErr" class="err"></div><button class="btn white">In die Queue schicken</button><div id="submitOk" class="ok"></div></form>
<p class="notice">1️⃣ Nur 1 Song gleichzeitig – sobald er einmal lief, kannst du den nächsten schicken.</p></div>`;
}

function pickFile(e){
 const f=e.target.files&&e.target.files[0],t=document.getElementById("fileName"),i=document.getElementById("fileInfo"),err=document.getElementById("submitErr");if(err)err.textContent="";

 const lower=(f.name||"").toLowerCase(),okExt=lower.endsWith(".mp3")||lower.endsWith(".wav");
 if(!okExt){pendingFile=null;e.target.value="";if(t)t.textContent="MP3 oder WAV auswählen";if(i)i.textContent="Nur MP3 oder WAV";if(err)err.textContent="Bitte eine MP3- oder WAV-Datei auswählen.";return}

function setupDrop(){const box=document.querySelector('.file');if(!box)return;['dragenter','dragover'].forEach(ev=>box.addEventListener(ev,e=>{e.preventDefault();box.classList.add('drag')}));['dragleave','drop'].forEach(ev=>box.addEventListener(ev,e=>{e.preventDefault();box.classList.remove('drag')}));box.addEventListener('drop',e=>{const f=e.dataTransfer?.files?.[0];if(f){const input=document.getElementById('file');try{const dt=new DataTransfer();dt.items.add(f);input.files=dt.files}catch(_){}pickFile({target:{files:[f],value:''}})}})}
async function uploadAudio(path,file,progressEl){
 const useTus=file.size>6*1024*1024 && window.tus;
 if(!useTus){let r=await sb.storage.from("songs").upload(path,file,{contentType:audioMime(file),cacheControl:"3600",upsert:false});if(progressEl)progressEl.style.width=r.error?"0":"100%";return r}
 const endpoint=SUPABASE_URL.replace('.supabase.co','.storage.supabase.co')+'/storage/v1/upload';
 return await new Promise(resolve=>{
   const upload=new tus.Upload(file,{endpoint:endpoint+'/',retryDelays:[0,1000,3000,5000],chunkSize:6*1024*1024,uploadDataDuringCreation:false,metadata:{bucketName:'songs',objectName:path,contentType:audioMime(file),cacheControl:'3600'},headers:{authorization:'Bearer '+SUPABASE_ANON_KEY,'x-upsert':'false'},onError:error=>resolve({error}),onProgress:(bytesUploaded,bytesTotal)=>{if(progressEl)progressEl.style.width=Math.round(bytesUploaded/bytesTotal*100)+'%'},onSuccess:()=>resolve({data:{path},error:null})});upload.start();
 });
}
async function submitSong(e){
e.preventDefault();let err=document.getElementById("submitErr"),ok=document.getElementById("submitOk");err.textContent="";ok.textContent="";
let name=document.getElementById("name").value.trim(),link=document.getElementById("link")?.value.trim(),msg=document.getElementById("message").value.trim();
if(state.mode==="link"&&!/^https?:\/\/.+/i.test(link||"")){err.textContent="Bitte einen gültigen Link eintragen.";return}
if(state.mode==="file"&&!pendingFile){err.textContent="Bitte MP3 oder WAV auswählen.";return}
let filePath=null;
if(state.mode==="file"){
 if(pendingFile.size>MAX_FILE_BYTES){err.textContent="Datei zu groß. Maximum: 50 MB.";return}
 filePath=state.room+"/"+uid()+"-"+pendingFile.name.replace(/[^a-zA-Z0-9._-]/g,"_");
 const progress=document.createElement('div');progress.className='progress';progress.innerHTML='<i></i>';document.getElementById('submitForm').appendChild(progress);err.textContent=pendingFile.size>6*1024*1024?'Große Datei – sicherer Upload läuft…':'Upload läuft…';
 let r=await uploadAudio(filePath,pendingFile,progress.querySelector('i'));progress.remove();if(r.error){err.textContent="Upload fehlgeschlagen: "+(r.error.message||r.error);return}
}
let newId=uid();
let payload={id:newId,room_slug:state.room,name,message:msg,link:state.mode==="link"?link:null,file_path:filePath,file_name:state.mode==="file"?pendingFile.name:null,file_type:state.mode==="file"?audioMime(pendingFile):null,file_size:state.mode==="file"?pendingFile.size:null,status:"pending",boosts:0};
let {error}=await sb.from("submissions").insert(payload);if(error){if(filePath)await sb.storage.from("songs").remove([filePath]);err.textContent=error.message;return}
pendingFile=null;
setMySubId(state.room,newId);
await checkMySubmission();
showSuccess(name,state.mySub?.position||1,state.mySub?.total||1);
toast("Track ist in der Queue 🔥");
loadPublic();
const host=document.getElementById("submitCardHost");if(host)host.innerHTML=submitCard();
}

function showSuccess(name,pos,total){
 const ov=document.getElementById("successOverlay");if(!ov)return;
 document.getElementById("successSub").textContent=`„${name}“ ist eingereicht – aktuell Platz ${pos} von ${total} in der Schlange.`;
 ov.classList.add("show");
}
function closeSuccess(){document.getElementById("successOverlay")?.classList.remove("show")}

function fileUrl(path){return sb.storage.from("songs").getPublicUrl(path).data.publicUrl}
function audioType(s){return s.file_type || (String(s.file_name||"").toLowerCase().endsWith(".wav")?"audio/wav":"audio/mpeg")}
let currentPlayingId=null;
function fmtTime(s){s=Math.floor(s||0);const m=Math.floor(s/60),ss=String(s%60).padStart(2,'0');return m+":"+ss}
function setListenState(id,playing){
 document.querySelectorAll('.audioCard').forEach(c=>c.classList.remove('playing'));
 document.querySelectorAll('.listen').forEach(b=>b.textContent='▶');
 if(id&&playing){const card=document.getElementById('ac-'+id),btn=document.getElementById('listenBtn-'+id);card?.classList.add('playing');if(btn)btn.textContent='❚❚'}
 const npb=document.getElementById('nowPlayBtn');if(npb)npb.textContent=playing?'❚❚':'▶';
}
function playAudio(id,fromDashboard){
 const a=document.getElementById("audio-"+id);if(!a)return;const src=a.querySelector('source')?.src||a.currentSrc;if(!src)return;
 const g=document.getElementById('globalAudio'),n=document.getElementById('now'),t=document.getElementById('nowTitle');
 if(g&&n){
  if(currentPlayingId!==id)g.src=src;
  currentPlayingId=id;g.play().catch(()=>{});n.classList.add('show');
  t.textContent=(a.closest('.ticket')?.querySelector('.name')?.textContent||'Song');
  setListenState(id,true);
  window.scrollTo({top:Math.max(0,(a.closest('.ticket')?.offsetTop||0)-90),behavior:'smooth'});
 }
 if(fromDashboard)markPlayed(id);
}
function toggleGlobalPlay(){
 const g=document.getElementById('globalAudio');if(!g||!g.src)return;
 if(g.paused){g.play().catch(()=>{});setListenState(currentPlayingId,true)}else{g.pause();setListenState(currentPlayingId,false)}
}
function seekGlobal(e){
 const g=document.getElementById('globalAudio'),bar=document.getElementById('nowBar');if(!g||!g.duration||!bar)return;
 const rect=bar.getBoundingClientRect(),pct=Math.min(1,Math.max(0,(e.clientX-rect.left)/rect.width));
 g.currentTime=pct*g.duration;
}
function closePlayer(){const g=document.getElementById('globalAudio');if(g){g.pause();g.removeAttribute('src');g.load()}document.getElementById('now')?.classList.remove('show');setListenState(null,false);currentPlayingId=null}
async function markPlayed(id){try{await sb.rpc('mark_played',{p_owner_token:ownerToken(),p_submission_id:id})}catch(e){}}
(function wireGlobalPlayer(){
 const g=document.getElementById('globalAudio');if(!g)return;
 g.addEventListener('timeupdate',()=>{
  const fill=document.getElementById('nowBarFill'),knob=document.getElementById('nowKnob'),cur=document.getElementById('nowCur'),dur=document.getElementById('nowDur');
  const pct=g.duration?(g.currentTime/g.duration*100):0;
  if(fill)fill.style.width=pct+'%';if(knob)knob.style.left=pct+'%';
  if(cur)cur.textContent=fmtTime(g.currentTime);if(dur)dur.textContent=fmtTime(g.duration);
  if(currentPlayingId){const mb=document.getElementById('miniBarFill-'+currentPlayingId);if(mb)mb.style.width=pct+'%'}
 });
 g.addEventListener('ended',()=>setListenState(currentPlayingId,false));
 g.addEventListener('pause',()=>setListenState(currentPlayingId,false));
 g.addEventListener('play',()=>setListenState(currentPlayingId,true));
})();

function ratingBlock(s,moderate){
 if(!moderate&&s.status!=="approved")return "";
 let voted=localStorage.getItem("street_vote_"+s.id)||"";
 return `<div class="rateTitle">${moderate?"🎙️ Streamer-Bewertung":"Bewertung"}</div><div class="rate">
 <button class="street ${voted==='street'?'selected':''}" onclick="vote('${s.id}','street',this)"><img class="rateImg" src="${STRASSE_IMG}" alt="100 PROZENT STRASSE" draggable="false"><span class="count">${s.street_votes||0} Stimmen</span></button>
 <button class="shit ${voted==='shit'?'selected':''}" onclick="vote('${s.id}','shit',this)"><img class="rateImg" src="${SCHEISSE_IMG}" alt="100 PROZENT SCHEISSE" draggable="false"><span class="count">${s.shit_votes||0} Stimmen</span></button>
 </div>`;
}

function ticket(s,i,moderate=false){
  let media=s.file_path
    ? `<div class="audioCard" id="ac-${s.id}"><button class="listen" onclick="playAudio('${s.id}')" id="listenBtn-${s.id}">▶</button><div class="miniMeta"><div style="font-size:11px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.file_name||"Audio")}</div><div class="miniBar"><i id="miniBarFill-${s.id}"></i></div></div><audio id="audio-${s.id}" preload="metadata" style="display:none"><source src="${esc(fileUrl(s.file_path))}" type="${esc(audioType(s))}"></audio></div>`
    : `<a class="sub" href="${esc(s.link||"#")}" target="_blank" rel="noopener">🔗 ${esc(s.link||"Link")}</a>`;
  let mod=moderate
    ? (s.status==="pending"
      ? `<div class="actions"><button class="mini play" onclick="moderate('${s.id}','approve')" title="Freigeben">✓</button><button class="mini danger" onclick="moderate('${s.id}','reject')" title="Ablehnen">✕</button></div>`
      : `<div class="actions"><button class="mini play" onclick="playAudio('${s.id}',true)" title="Song abspielen">▶</button><button class="mini danger" onclick="moderate('${s.id}','delete')" title="Löschen">🗑</button></div>`)
    : "";
  let medal=(!moderate && i<3)?medalClass(i+1):"";
  let numHtml=medal?`<div class="num medal ${medal}">${medalEmoji(i+1)}</div>`:`<div class="num">${i+1}</div>`;
  let mine=(!moderate && state.mySub && state.mySub.id===s.id)?" mine":"";
  return `<div class="ticket${mine}"><div class="tickettop">${numHtml}<div class="body">
    <div class="name">${esc(s.name)} ${s.boosts?`<span style="color:#fff;font-size:10px">🚀 +${s.boosts}</span>`:""}</div>
    <div class="sub">${new Date(s.created_at).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})} · ${s.status==="pending"?"wartet auf Freigabe":"freigegeben"}${s.played_at?" · ✓ lief bereits":""}</div>
    ${media}${s.message?`<div class="msg">„${esc(s.message)}“</div>`:""}${ratingBlock(s,moderate)}
  </div>${mod}</div></div>`;
}
async function loadPublic(){
if(!sb||state.view!=="room")return;
let {data,error}=await sb.from("submissions").select("*").eq("room_slug",state.room).in("status",["approved","pending"]).order("boosts",{ascending:false}).order("created_at",{ascending:true});
if(error){let el=document.getElementById('publicQueue');if(el)el.innerHTML='<p class="empty">Die Tracks konnten gerade nicht geladen werden.</p>';return}
state.publicSubs=(data||[]).filter(s=>s.status==="approved");let q=document.getElementById("queueCount");if(q)q.textContent=state.publicSubs.length+" Tracks";renderPublicQueue();
}
function setPublicFilter(f){state.publicFilter=f;document.querySelectorAll('[data-pfilter]').forEach(b=>b.classList.toggle('active',b.dataset.pfilter===f));renderPublicQueue()}
function renderPublicQueue(){
let el=document.getElementById('publicQueue');if(!el)return;let subs=[...(state.publicSubs||[])],q=(document.getElementById('publicSearch')?.value||'').trim().toLowerCase();
if(q)subs=subs.filter(s=>(s.name+' '+(s.message||'')+' '+(s.file_name||'')).toLowerCase().includes(q));
if(state.publicFilter==='top')subs.sort((a,b)=>((b.street_votes||0)-(b.shit_votes||0))-((a.street_votes||0)-(a.shit_votes||0)));
else if(state.publicFilter==='street')subs.sort((a,b)=>(b.street_votes||0)-(a.street_votes||0));
else subs.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
el.innerHTML=subs.map((s,i)=>ticket(s,i,false)).join('')||`<p class="empty">Keine passenden Tracks gefunden.</p>`;
}
async function wirePublic(){if(state.view==="room"){setupDrop();await loadPublic()}}

async function vote(id,type,btn){
  let {data,error}=await sb.rpc("vote_submission",{p_submission_id:id,p_voter_id:voterId(),p_vote_type:type});
  if(error){toast("Bewertung fehlgeschlagen");return}
  const ticketEl=btn.closest(".ticket");
  ticketEl?.querySelectorAll(".rate button").forEach(b=>b.classList.remove("selected"));
  btn.classList.add("selected");
  btn.classList.remove("pop");void btn.offsetWidth;btn.classList.add("pop");
  let flash=document.createElement("span");flash.className="impactFlash";btn.appendChild(flash);setTimeout(()=>flash.remove(),460);
  const emojis=type==="street"?["⚡","🔥","✨","💯"]:["💩","🩸","💀","😂"];
  spawnParticles(btn,emojis[Math.floor(Math.random()*emojis.length)]);
  setTimeout(()=>spawnParticles(btn,emojis[Math.floor(Math.random()*emojis.length)]),90);
  playImpactSound(type);
  if(ticketEl){ticketEl.classList.remove("shake");void ticketEl.offsetWidth;ticketEl.classList.add("shake")}
  if(navigator.vibrate)navigator.vibrate(type==="street"?[18,30,18]:[10,20,10,20,30]);
  if(data && ticketEl){
    const buttons=ticketEl.querySelectorAll(".rate button");
    if(buttons[0]) buttons[0].querySelector(".count").textContent=data.street_votes+" Stimmen";
    if(buttons[1]) buttons[1].querySelector(".count").textContent=data.shit_votes+" Stimmen";
  }
  setTimeout(()=>{loadPublic();loadDashboard()},250);
}

function playImpactSound(type){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const t=audioCtx.currentTime;
  if(type==="street"){
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type="triangle";o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(60,t+.18);
   g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.5,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.32);
   o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.34);
   const bufSize=audioCtx.sampleRate*.15,buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate),d=buf.getChannelData(0);
   for(let i=0;i<bufSize;i++)d[i]=(Math.random()*2-1)*(1-i/bufSize);
   const n=audioCtx.createBufferSource();n.buffer=buf;
   const ng=audioCtx.createGain();ng.gain.setValueAtTime(.22,t);ng.gain.exponentialRampToValueAtTime(.001,t+.14);
   const hp=audioCtx.createBiquadFilter();hp.type="highpass";hp.frequency.value=1200;
   n.connect(hp);hp.connect(ng);ng.connect(audioCtx.destination);n.start(t);n.stop(t+.15);
  }else{
   const bufSize=audioCtx.sampleRate*.32,buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate),d=buf.getChannelData(0);
   for(let i=0;i<bufSize;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,1.4);
   const n=audioCtx.createBufferSource();n.buffer=buf;
   const lp=audioCtx.createBiquadFilter();lp.type="lowpass";lp.frequency.setValueAtTime(1800,t);lp.frequency.exponentialRampToValueAtTime(220,t+.3);
   const ng=audioCtx.createGain();ng.gain.setValueAtTime(.35,t);ng.gain.exponentialRampToValueAtTime(.001,t+.3);
   n.connect(lp);lp.connect(ng);ng.connect(audioCtx.destination);n.start(t);n.stop(t+.32);
   const o=audioCtx.createOscillator(),g2=audioCtx.createGain();
   o.type="sawtooth";o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(70,t+.28);
   g2.gain.setValueAtTime(.001,t);g2.gain.exponentialRampToValueAtTime(.22,t+.02);g2.gain.exponentialRampToValueAtTime(.001,t+.3);
   o.connect(g2);g2.connect(audioCtx.destination);o.start(t);o.stop(t+.3);
  }
 }catch(e){}
}
async function moderate(id,action){
let {error}=await sb.rpc("moderate_submission",{p_owner_token:ownerToken(),p_submission_id:id,p_action:action});
if(error)alert(error.message);else loadDashboard();
}
async function boost(id){
let {error}=await sb.rpc("boost_submission",{p_submission_id:id});if(error)alert(error.message);else loadPublic();
}
async function render(){
parse();let app=document.getElementById("app");
document.getElementById("startBtn").classList.toggle("on",state.view==="landing");document.getElementById("dashBtn").classList.toggle("on",state.view==="dashboard");
if(state.view==="landing")app.innerHTML=landing();
else if(state.view==="dashboard"){app.innerHTML=dashboard();setTimeout(loadDashboard,0)}
else{let r=await roomExists(state.room);if(!r)app.innerHTML=`<div class="card"><h2>404</h2><p class="empty">Dieser Raum existiert nicht.</p></div>`;else{await checkMySubmission();app.innerHTML=roomView();wirePublic()}}
}

async function checkMySubmission(){
 if(!sb||!state.room){state.mySub=null;return}
 const id=getMySubId(state.room);
 if(!id){state.mySub=null;return}
 let {data,error}=await sb.from("submissions").select("id,status,played_at,created_at,name").eq("id",id).maybeSingle();
 if(error||!data||data.status==="rejected"){clearMySubId(state.room);state.mySub=null;return}
 if(data.status==="approved"&&data.played_at){clearMySubId(state.room);state.mySub=null;return}
 let {data:queue}=await sb.from("submissions").select("id,created_at").eq("room_slug",state.room).in("status",["pending","approved"]).order("created_at",{ascending:true});
 let pos=(queue||[]).findIndex(x=>x.id===id);
 state.mySub={...data,position:pos>=0?pos+1:1,total:(queue||[]).length||1};
}
function refreshMySubmissionCard(){
 if(state.view!=="room")return;
 checkMySubmission().then(()=>{
  const host=document.getElementById("submitCardHost");
  if(host) host.innerHTML=submitCard();
 });
}

render();
setInterval(()=>{if(state.view==="room"){loadPublic();refreshMySubmissionCard()}if(state.view==="dashboard")loadDashboard()},15000);
</script>
